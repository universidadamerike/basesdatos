{% extends "base.html" %}
{% from "_error_sql.html" import mostrar_error %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">🏬 Tienda Departamental</h3>
                <h6 class="text-center text-muted mb-4">Inicio de sesión de empleados</h6>

                {% if error_login %}
                <div class="alert alert-warning">{{ error_login }}</div>
                {% endif %}

                {{ mostrar_error(error_sql) }}

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control" name="usuario" placeholder="Ej. admin" autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name="clave" placeholder="Contraseña" autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
